<!DOCTYPE html>
<html>
<body>
<h2>WebSocket Test</h2>
<script>
const ws = new WebSocket("ws://localhost:9090");
ws.onopen = () => {
    console.log("✅ Connected to server");
    ws.send("Hello from browser!");
};
ws.onmessage = e => {
    console.log("📩 Server replied:", e.data);
};
ws.onerror = e => {
    console.error("❌ WebSocket error:", e);
};
</script>
</body>
</html>
